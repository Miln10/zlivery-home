<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#185FA5">
<meta name="description" content="Zlivery — painel de acesso rápido">
<title>Zlivery</title>
<style>
  :root {
    --blue: #185FA5;
    --blue-dark: #0f4275;
    --green: #1f9d55;
    --green-dark: #167a42;
    --orange: #e07b1a;
    --orange-dark: #b5620f;
    --bg: #f4f6f8;
    --text: #1c2733;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    padding: 32px 16px;
  }
  .logo {
    margin-bottom: 8px;
  }
  .logo img {
    display: block;
    height: 96px;
    width: auto;
  }
  .subtitle {
    color: #5b6b7a;
    margin-bottom: 36px;
    font-size: 15px;
    text-align: center;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    width: 100%;
    max-width: 720px;
  }
  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; max-width: 320px; }
  }
  a.card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 28px 18px;
    border-radius: 18px;
    text-decoration: none;
    color: #fff;
    font-weight: 600;
    font-size: 17px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.10);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  a.card:active { transform: scale(0.97); }
  @media (hover: hover) {
    a.card:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(0,0,0,0.16); }
  }
  .card.logistica { background: linear-gradient(135deg, var(--blue), var(--blue-dark)); }
  .card.estoque   { background: linear-gradient(135deg, var(--green), var(--green-dark)); }
  .card.financeiro{ background: linear-gradient(135deg, var(--orange), var(--orange-dark)); }
  .icon { width: 44px; height: 44px; }
  footer {
    margin-top: 40px;
    font-size: 12px;
    color: #9aa7b2;
  }
</style>
</head>
<body>
  <div class="logo"><img src="zlivery-logo.jpg" alt="Zlivery"></div>
  <div class="subtitle">Selecione uma área para continuar</div>

  <div class="grid">
    <a class="card logistica" href="https://miln10.github.io/Entregou-react-V2/">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="7" width="14" height="10" rx="1.5"></rect>
        <path d="M15 10h4l3 3v4h-7z"></path>
        <circle cx="6" cy="19" r="2"></circle>
        <circle cx="18" cy="19" r="2"></circle>
      </svg>
      <span>Logística</span>
    </a>

    <a class="card estoque" href="https://miln10.github.io/estoque-cali-burritos/">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7l9-4 9 4-9 4-9-4z"></path>
        <path d="M3 7v10l9 4 9-4V7"></path>
        <path d="M12 11v10"></path>
      </svg>
      <span>Estoque</span>
    </a>

    <a class="card financeiro" href="https://miln10.github.io/estoque-cali-burritos/">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 7v10"></path>
        <path d="M15 9.5c0-1.4-1.3-2.5-3-2.5s-3 1.1-3 2.5 1.3 2 3 2.5 3 1.1 3 2.5-1.3 2.5-3 2.5-3-1.1-3-2.5"></path>
      </svg>
      <span>Financeiro</span>
    </a>
  </div>

  <footer>Cali Burritos · Zlivery</footer>
</body>
</html>
